<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="durable-workflow-title">
  <title id="durable-workflow-title">Durable Workflow Engine in Go and PostgreSQL</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#151d2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00add8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)" />
  <rect x="44" y="40" width="712" height="52" rx="10" fill="#111827" stroke="#1f2937" />
  <circle cx="70" cy="66" r="6" fill="#ef4444" />
  <circle cx="92" cy="66" r="6" fill="#f59e0b" />
  <circle cx="114" cy="66" r="6" fill="#10b981" />
  <text x="142" y="71" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">Durable-Workflow-Engine</text>
  <rect x="518" y="52" width="220" height="28" rx="14" fill="#0f172a" stroke="#334155" />
  <text x="628" y="71" text-anchor="middle" fill="#00add8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Go · PostgreSQL · Docker</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="56" y="156" width="150" height="114" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="131" y="196" text-anchor="middle" fill="#00add8" font-size="12" font-weight="700">STEP 1</text>
    <text x="131" y="222" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Enqueue</text>
    <text x="131" y="244" text-anchor="middle" fill="#94a3b8" font-size="12">Idempotent Task</text>

    <path d="M208 213 H236" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="238" y="146" width="160" height="134" rx="12" fill="#0f172a" stroke="#00add8" stroke-width="2" />
    <text x="318" y="188" text-anchor="middle" fill="#00add8" font-size="12" font-weight="700">STEP 2</text>
    <text x="318" y="216" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Checkpoint</text>
    <text x="318" y="240" text-anchor="middle" fill="#cbd5e1" font-size="12">Durable State</text>
    <text x="318" y="258" text-anchor="middle" fill="#94a3b8" font-size="11">ACID PostgreSQL</text>

    <path d="M400 213 H428" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="430" y="156" width="150" height="114" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="505" y="196" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">STEP 3</text>
    <text x="505" y="222" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Lease &amp; Retry</text>
    <text x="505" y="244" text-anchor="middle" fill="#94a3b8" font-size="12">Backoff + DLQ</text>

    <path d="M582 213 H610" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="612" y="156" width="132" height="114" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <text x="678" y="196" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">STEP 4</text>
    <text x="678" y="222" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Worker Pool</text>
    <text x="678" y="244" text-anchor="middle" fill="#94a3b8" font-size="12">Crash-Safe</text>
  </g>

  <rect x="56" y="328" width="688" height="116" rx="12" fill="#090d16" stroke="#1e293b" />
  <text x="80" y="362" fill="#00add8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">SELECT * FROM workflow_tasks WHERE status = 'leased' FOR UPDATE SKIP LOCKED;</text>
  <text x="80" y="392" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">checkpoint(run_id, step_key) -&gt; persisted · lease_ttl=30s · heartbeat=ok</text>
  <text x="80" y="420" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✓ distributed workers · deterministic replay · zero lost jobs</text>
</svg>
