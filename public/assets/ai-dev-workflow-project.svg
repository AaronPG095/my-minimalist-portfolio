<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ai-dev-workflow-title">
  <title id="ai-dev-workflow-title">AI-Dev-Workflow Multi-Agent CI Pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#141c2b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)" />
  <g opacity="0.14" stroke="#64748b" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M160 0 V500 M320 0 V500 M480 0 V500 M640 0 V500" />
  </g>
  <rect x="44" y="40" width="712" height="52" rx="10" fill="#111827" stroke="#1f2937" />
  <circle cx="70" cy="66" r="6" fill="#ef4444" />
  <circle cx="92" cy="66" r="6" fill="#f59e0b" />
  <circle cx="114" cy="66" r="6" fill="#10b981" />
  <text x="142" y="71" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">AI-Dev-Workflow</text>
  <rect x="546" y="52" width="192" height="28" rx="14" fill="#0f172a" stroke="#334155" />
  <text x="642" y="71" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Node.js · Zero Dependencies</text>

  <!-- Pipeline Nodes -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="56" y="168" width="122" height="104" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="117" y="206" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">01</text>
    <text x="117" y="229" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Zero-Token</text>
    <text x="117" y="248" text-anchor="middle" fill="#94a3b8" font-size="12">Session Prime</text>

    <path d="M180 220 H198" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="200" y="168" width="112" height="104" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="256" y="206" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">02</text>
    <text x="256" y="229" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Plan &amp;</text>
    <text x="256" y="248" text-anchor="middle" fill="#94a3b8" font-size="12">Packets</text>

    <path d="M314 220 H332" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="334" y="156" width="132" height="128" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="400" y="198" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">03</text>
    <text x="400" y="223" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Parallel</text>
    <text x="400" y="244" text-anchor="middle" fill="#cbd5e1" font-size="13">Worktree Waves</text>

    <path d="M468 220 H486" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="488" y="168" width="122" height="104" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="549" y="206" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">04</text>
    <text x="549" y="229" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Adversarial</text>
    <text x="549" y="248" text-anchor="middle" fill="#94a3b8" font-size="12">Review Loop</text>

    <path d="M612 220 H630" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="632" y="168" width="112" height="104" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <text x="688" y="206" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">05</text>
    <text x="688" y="229" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">CI Gate</text>
    <text x="688" y="248" text-anchor="middle" fill="#94a3b8" font-size="12">Verified</text>
  </g>

  <!-- Terminal Summary Bar -->
  <rect x="56" y="328" width="688" height="116" rx="12" fill="#090d16" stroke="#1e293b" />
  <text x="80" y="362" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$ node scripts/prime.mjs --wave parallel --review adversarial</text>
  <text x="80" y="392" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✓ review packets generated · worktrees isolated · 0 runtime dependencies</text>
  <text x="80" y="420" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✓ CI harness checks passed — ready for merge</text>
