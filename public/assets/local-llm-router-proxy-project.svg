  <rect x="56" y="348" width="688" height="96" rx="12" fill="#090d16" stroke="#1e293b" />
  <text x="80" y="384" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">cache_hit=true latency=2.4ms saved_tokens=1,840 cost=$0.00</text>
  <text x="80" y="414" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✓ standalone Go binary · local-first privacy · automatic fallback</text>
