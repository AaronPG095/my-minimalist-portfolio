<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="llm-router-title">
  <title id="llm-router-title">Local LLM Router Proxy with Semantic Cache</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#171e2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)" />
  <rect x="44" y="40" width="712" height="52" rx="10" fill="#111827" stroke="#1f2937" />
  <circle cx="70" cy="66" r="6" fill="#ef4444" />
  <circle cx="92" cy="66" r="6" fill="#f59e0b" />
  <circle cx="114" cy="66" r="6" fill="#10b981" />
  <text x="142" y="71" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">Local-LLM-Router-Proxy</text>
  <rect x="524" y="52" width="214" height="28" rx="14" fill="#0f172a" stroke="#334155" />
  <text x="631" y="71" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Go · Semantic Cache</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="56" y="168" width="166" height="112" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="139" y="208" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">REQUEST</text>
    <text x="139" y="234" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">OpenAI-Compatible</text>
    <text x="139" y="256" text-anchor="middle" fill="#64748b" font-size="12">/v1/chat/completions</text>

    <path d="M224 224 H270" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />

    <rect x="272" y="144" width="212" height="160" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
    <text x="378" y="182" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">SMART ROUTER</text>
    <text x="378" y="212" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Semantic Cache?</text>
    <text x="378" y="238" text-anchor="middle" fill="#10b981" font-size="12" font-weight="600">Hit -&gt; Instant 0-Token Reply</text>
    <text x="378" y="262" text-anchor="middle" fill="#cbd5e1" font-size="12">Miss -&gt; Complexity Classifier</text>

    <path d="M486 190 L546 164" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M486 258 L546 284" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />

    <rect x="548" y="128" width="196" height="74" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <text x="646" y="159" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">FAST TIER</text>
