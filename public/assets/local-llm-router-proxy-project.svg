    <rect x="548" y="246" width="196" height="74" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
    <text x="646" y="277" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="700">REASONING TIER</text>
