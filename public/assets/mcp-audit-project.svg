<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="mcp-audit-title">
  <title id="mcp-audit-title">mcp-audit Security and Permission Auditor CLI</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#141b29" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)" />
  <rect x="44" y="40" width="712" height="52" rx="10" fill="#111827" stroke="#1f2937" />
  <circle cx="70" cy="66" r="6" fill="#ef4444" />
  <circle cx="92" cy="66" r="6" fill="#f59e0b" />
  <circle cx="114" cy="66" r="6" fill="#10b981" />
  <text x="142" y="71" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">mcp-audit</text>
  <rect x="498" y="52" width="240" height="28" rx="14" fill="#0f172a" stroke="#334155" />
  <text x="618" y="71" text-anchor="middle" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Read-Only · Zero Dependencies</text>

  <!-- Terminal Body -->
  <rect x="56" y="122" width="688" height="324" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="84" y="164" fill="#38bdf8">$ npx mcp-audit --config ~/.mcp.json</text>
    <text x="84" y="200" fill="#94a3b8">Scanning 4 MCP servers for permission &amp; injection risks...</text>

    <rect x="84" y="222" width="632" height="44" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="104" y="249" fill="#10b981" font-weight="700">PASS</text>
    <text x="172" y="249" fill="#f8fafc">context-gatekeeper</text>
    <text x="410" y="249" fill="#94a3b8">scoped-fs · no shell-exec</text>

    <rect x="84" y="278" width="632" height="44" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="104" y="305" fill="#f59e0b" font-weight="700">WARN</text>
    <text x="172" y="305" fill="#f8fafc">custom-db-server</text>
    <text x="410" y="305" fill="#cbd5e1">write-tool + unpinned env</text>

    <rect x="84" y="334" width="632" height="44" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="104" y="361" fill="#ef4444" font-weight="700">HIGH</text>
    <text x="172" y="361" fill="#f8fafc">legacy-shell-mcp</text>
    <text x="410" y="361" fill="#fca5a5">arbitrary-exec · broad token</text>

    <text x="84" y="416" fill="#10b981">Summary: 0 mutations · deterministic CLI audit · exit 1 on HIGH</text>
  </g>
</svg>
